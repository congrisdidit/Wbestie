<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanted Posters - Poster 1</title>
  <style>
    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: #2b1b0e;
      color: #241507;
      font-family: Georgia, "Times New Roman", serif;
    }

    /* TOP NAVBAR */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px;
      background: #160d06;
      border-bottom: 4px solid #8a5a24;
      box-shadow: 0 4px 15px rgba(0,0,0,.5);
    }

    .navbar a {
      color: #f4daa1;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 18px;
      border: 2px solid #8a5a24;
      background: #38200d;
      border-radius: 5px;
    }

    .navbar a:hover {
      background: #6d421c;
    }

    /* POSTER */
    .poster {
      width: min(700px, calc(100% - 30px));
      margin: 40px auto;
      padding: 35px;
      text-align: center;
      color: #241507;
      background:
        linear-gradient(rgba(244, 218, 161, .95), rgba(218, 181, 111, .95)),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 4px,
          rgba(80,45,10,.08) 5px
        );
      border: 12px solid #5b3515;
      box-shadow: 0 20px 50px rgba(0,0,0,.65), inset 0 0 30px rgba(75,40,10,.45);
      position: relative;
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 3px solid #6d421c;
      pointer-events: none;
    }

    .wanted {
      font-size: clamp(60px, 12vw, 110px);
      font-weight: 900;
      letter-spacing: 8px;
      line-height: .9;
      margin: 5px 0 15px;
      text-shadow: 3px 3px 0 #9a6b32;
    }

    .subtitle {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 3px;
      border-top: 3px solid #38200d;
      border-bottom: 3px solid #38200d;
      padding: 8px;
      margin-bottom: 25px;
    }

    .portrait {
      width: 280px;
      height: 300px;
      margin: auto;
      background: #d0ad70;
      border: 8px solid #4e2b11;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      box-shadow: inset 0 0 25px rgba(0,0,0,.45);
    }

    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: sepia(80%) contrast(1.15);
    }

    h1 {
      margin: 20px 0 5px;
      font-size: 38px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .crime {
      font-size: 22px;
      font-weight: bold;
      margin: 10px 0;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 25px 0;
      text-align: left;
      font-size: 18px;
    }

    .details div {
      padding: 8px;
      border-bottom: 2px solid #79501f;
    }

    .reward {
      margin: 25px auto;
      padding: 12px;
      width: 80%;
      border: 4px double #3d210c;
      font-size: 30px;
      font-weight: bold;
    }

    .warning {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
    }

    .contact {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .poster {
        padding: 25px 18px;
        border-width: 7px;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .portrait {
        width: 220px;
        height: 240px;
      }

      .reward {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="poster1.html">Poster 1</a>
    <a href="poster2.html">Poster 2</a>
  </nav>

  <!-- POSTER 1 -->
  <main class="poster">
    <div class="wanted">WANTED</div>
    <div class="subtitle">DEAD OR ALIVE</div>

    <div class="portrait">
      <img src="images/Ethan.png" alt="Wanted person">
    </div>

    <h1>Ethan Tamasate</h1>

    <div class="crime">
      WANTED FOR: Robbing a blind homeless man
    </div>

    <section class="details">
      <div><strong>Alias: </strong>The poor thief</div>
      <div><strong>Age:</strong> 13</div>
      <div><strong>Height:</strong> 3'2" gremlin</div>
      <div><strong>Last Seen:</strong> Gooning in a public park</div>
    </section>

    <div class="reward">REWARD: $0.5</div>

    <div class="warning">
      THIS INDIVIDUAL IS A DIPSHIT DO NOT FEED.<br>
      DO NOT APPROACH.
    </div>

    <div class="contact">
      Contact Menlam
    </div>
  </main>

</body>
</html>
